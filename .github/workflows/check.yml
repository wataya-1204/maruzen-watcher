name: Maruzen Watcher

on:
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: maruzen-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: node check.mjs
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Commit updated state.json
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "maruzen-watcher-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update state.json"
            git push
          else
            echo "state.json に変更なし"
          fi
